<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | The Flying Cowboys</title>
    <link href="/styles/main.css" rel="stylesheet" type="text/css" />
    <link
      href="https://db.onlinewebfonts.com/c/5b9f6ccea36b2b4a1e6d4ca926bbbc44?family=Clarendon+W01+Medium"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond&amp;family=Grape+Nuts&amp;family=Source+Serif+4:opsz,wght@8..60,200&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="navbar">
      <img src="/assets/fly-cowboys.png" alt="flying-cowboys" />
    </div>
    <div class="hero-page">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="/assets/flying-planes.mp4" type="video/mp4" />
      </video>
      <img
        class="hero-img"
        src="/assets/fly-cowboys.png"
        alt="Flying Cowboys Logo Large"
      />
    </div>
    <div class="mission-section">
      <div class="mission-wrapper">
        <h1><strong>OUR MISSION</strong></h1>
        <img src="/assets/mission-emblem.png" alt="plane-logo" />
        <p>
          The Flying Cowboys are a group of back country aviation enthusiasts
          striving to <br />increase their skills while promoting general
          aviation through continual training and <br />
          sharing of their lessons learned through social media.
        </p>
      </div>
    </div>
  </body>
</html>
